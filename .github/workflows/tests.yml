# 唯一的测试门禁。**它有两个调用方**:每次推 main / 每个 PR(ci.yml),以及打 tag 发版
# (release.yml)。抽成 workflow_call 而不是在两处各写一遍 —— 两份会漂,而漂的方向必然是
# 「发版那份更严」,于是主干上跑的其实是另一道更松的闸。
#
# 为什么不直接给 release.yml 加 push 触发:那样 build(mac/win 打包)会在每次推 main 时跑。
# 它的 if 允许 draft 被跳过,所以只加触发条件等于每次提交都出两个安装包。
name: Tests

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            website/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # 没有 ffmpeg 的话,9 个测试文件会整体 skip —— 导出与渲染主流程都在里面。
      # 那样这道闸看着是绿的,实际没验到最该验的那部分。
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # 沙箱执行时禁止拉取镜像,所以测试前显式准备。环境不可用必须阻止发版,
      # 不能让隔离用例被跳过后仍然显示测试通过。
      - name: Prepare sandbox runtime
        run: |
          for i in $(seq 1 30); do
            docker info >/dev/null 2>&1 && break
            sleep 1
          done
          test "$(docker info --format '{{.OSType}} {{.MemoryLimit}} {{.SwapLimit}} {{.PidsLimit}}')" = "linux true true true"
          docker pull python:3.13-alpine

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir website install --frozen-lockfile
          cd backend && uv sync --frozen --python 3.13

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          package_version=$(node -p "require('./package.json').version")
          tag_version="${GITHUB_REF_NAME#v}"
          test "$package_version" = "$tag_version" || {
            echo "::error::package.json is $package_version but release tag is $tag_version"
            exit 1
          }

      # 两侧 lint 都是零告警,所以它能当闸用 —— 一条开局几百条警告的 lint 只能当摆设。
      # 放在测试前面:它几秒钟就跑完,而且它抓的那类问题(未定义名字、未用变量)在测试
      # 里往往表现为一个八竿子打不着的报错。
      - name: Lint
        run: pnpm lint

      - name: Backend tests
        run: cd backend && uv run pytest -q

      # frontend 的 build 脚本本身带 `tsc --noEmit`(见 package.json),所以类型检查
      # 由 build 阶段覆盖,这里只跑单测。
      - name: Frontend tests
        run: cd frontend && pnpm vitest run

      - name: Browser extension tests and build
        run: |
          pnpm --dir browser-extension test
          pnpm --dir browser-extension typecheck
          pnpm build:extension

      # 官网是独立 pnpm 工作区,不会被根目录的 install/build 顺带覆盖。
      # production build 同时检查 TypeScript、路由、MDX 和服务端渲染边界。
      # 当前 typescript-eslint 拒绝 TS 7,不能把一条必红的 lint 伪装成门禁。
      - name: Website tests and production build
        run: |
          pnpm --dir website test
          pnpm --dir website build
