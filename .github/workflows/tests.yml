# 唯一的测试门禁。**它有两个调用方**:每次推 main / 每个 PR(ci.yml),以及打 tag 发版
# (release.yml)。抽成 workflow_call 而不是在两处各写一遍 —— 两份会漂,而漂的方向必然是
# 「发版那份更严」,于是主干上跑的其实是另一道更松的闸。
#
# 为什么不直接给 release.yml 加 push 触发:那样 build(mac/win 打包)会在每次推 main 时跑。
# 它的 if 允许 draft 被跳过,所以只加触发条件等于每次提交都出两个安装包。
name: Tests

on:
  workflow_call:
    inputs:
      # 两项只给定时的「乱序 + 线程起步抖动」那一跑用(chaos.yml);平时的门禁都不带,行为和以前一样。
      thread-jitter:
        description: 每条新线程起步前随机等 0~这么多秒(backend/tests/thread_jitter.py);空 = 不抖
        type: string
        default: ""
      shuffle-seed:
        description: 后端用 pytest-randomly、前端用 vitest --sequence.shuffle 按这个种子打乱顺序;空 = 不打乱
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # 三组并行跑,各自出结论:便宜的那组(lint、契约快照、sidecar / electron / 扩展、官网)几分钟就有结果,
  # 不用再排在二十分钟的后端测试后面 —— f5db6125f 那次官网 MDX 写坏,要等满整个 job 才报出来。
  # 三组都过,这道门禁才算过(ci.yml / release.yml 等的是整个 workflow,不是哪一个 job)。
  # 本机门禁是同一份清单:README「测试与检查」。
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir website install --frozen-lockfile
          cd backend && uv sync --frozen --python 3.14

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          package_version=$(node -p "require('./package.json').version")
          tag_version="${GITHUB_REF_NAME#v}"
          test "$package_version" = "$tag_version" || {
            echo "::error::package.json is $package_version but release tag is $tag_version"
            exit 1
          }

      # 五处 lint(frontend、website 的 oxlint,backend、community、packages/mosael-formats 的 ruff)都是零告警,所以它能当闸用 —— 一条开局几百条警告的 lint 只能当摆设。
      # 放在测试前面:它几秒钟就跑完,而且它抓的那类问题(未定义名字、未用变量)在测试
      # 里往往表现为一个八竿子打不着的报错。
      - name: Lint
        run: pnpm lint

      # 契约链快照的新鲜度:openapi.json 必须是 app 此刻的形状,schema.d.ts 必须是从它
      # 再生成出来的那份。此前两端靠手工同步,漂移没有任何闸 —— 已经实测漂过一次
      # (BoardGenerate.provider_profile_id 进了路由没进快照)。
      - name: OpenAPI snapshot and generated schema are fresh
        # `cd` 放进子 shell,每条命令各占一行。原先写成
        #   cd backend && uv run ... --check && cd ..
        # 而 `set -e` 对 AND-OR 列表里**非末位**的命令不生效 —— `--check` 失败时既不退出、
        # 也不报自己的错,只是 `cd ..` 没执行;于是后面那句 git diff 在 backend/ 里跑,
        # 报出 "unknown revision or path not in the working tree"。一条闸报了个完全无关的
        # 原因,比不报更难查(实测:真实原因是 openapi.json 没重新导出,查了两轮才找到)。
        run: |
          (cd backend && uv run python scripts/export_openapi.py --check)
          pnpm gen:api
          git diff --exit-code frontend/src/api/generated/schema.d.ts

      # sidecar 此前只在发版期跑:context-meter 契约的 Node 一侧在主干没有门。
      # test 清单末尾的 bundle 冒烟要 dist 在,所以先 build。
      - name: Agent sidecar typecheck and tests
        run: |
          pnpm --dir agent-sidecar typecheck
          pnpm --dir agent-sidecar build
          pnpm --dir agent-sidecar test

      # esbuild 只打包不查类型 —— 发布执行器的类型检查此前只在发版期,攒出过失效的
      # @ts-expect-error 和死参数才被发现。挪到主干,坏了就别合。
      - name: Electron typecheck
        run: pnpm typecheck:electron

      - name: Browser extension tests and build
        run: |
          pnpm --dir browser-extension test
          pnpm --dir browser-extension typecheck
          pnpm build:extension

      # 官网是独立 pnpm 工作区,不会被根目录的 install/build 顺带覆盖。
      # production build 同时检查 TypeScript、路由、MDX 和服务端渲染边界。
      # 官网的 lint 不在这里:它挂在根的 `pnpm lint` 里,由上面的 Lint 步骤跑 —— 这样本地提交前
      # 跑的那一条和 CI 是同一条,不会出现「本地没跑到、CI 才红」。
      - name: Website tests and production build
        run: |
          pnpm --dir website test
          pnpm --dir website build

  # 前端:类型检查(`build` 的前一半,`tsc --noEmit`)和整套 vitest(连同 electron/ 下的测试)。
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 类型检查此前不在任何一道闸里,类型错进了 main,要到打 tag 发版时 release 的打包才炸。
      - name: Frontend typecheck
        run: pnpm --dir frontend exec tsc --noEmit

      - name: Frontend tests
        env:
          SHUFFLE_SEED: ${{ inputs.shuffle-seed }}
        run: |
          cd frontend
          if [ -n "$SHUFFLE_SEED" ]; then
            pnpm vitest run --sequence.shuffle --sequence.seed="$SHUFFLE_SEED"
          else
            pnpm vitest run
          fi

  # 后端整套。最慢的一组,所以它自己一个 job、工具链之外只装它要的:ffmpeg、沙箱的 Docker 镜像、烧字用的前端 dist 和 Chromium。
  backend:
    runs-on: ubuntu-latest
    # 正常十几分钟。上限是给「挂住」的:没有它,一条死锁的测试要占着 runner 等满默认的 6 小时。
    # 挂住的那条会在 10 分钟时由 faulthandler 打出所有线程的栈(backend/pyproject.toml),日志里看得到卡在哪。
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain

      # 没有 ffmpeg 的话,9 个测试文件会整体 skip —— 导出与渲染主流程都在里面。
      # Ubuntu 24.04 自带的是 6.1,其 framesync 在 EOF 处有已知时序缺陷;产品与开发环境已经以
      # 现代 FFmpeg 为基线,CI 也必须测同一条契约,不能继续为发行多年前的运行时堆兼容滤镜。
      # 下载地址与 sha256 都钉在一次不可变的上游构建,避免 latest 静默换包。
      - uses: actions/cache@v5
        id: ffmpeg-cache
        with:
          path: .ci/ffmpeg
          key: ffmpeg-linux64-8.1.3-14-g330caae0c1-89cca03b
      - name: Install FFmpeg 8.1
        env:
          FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-01-13-06/ffmpeg-n8.1.3-14-g330caae0c1-linux64-gpl-8.1.tar.xz
          FFMPEG_SHA256: 89cca03b81002bef5a48c2e983afa6100e52904052c1c75dfd2090b09b57efee
        run: |
          if [ ! -x .ci/ffmpeg/bin/ffmpeg ]; then
            curl --fail --location --retry 3 "$FFMPEG_URL" --output /tmp/ffmpeg.tar.xz
            echo "$FFMPEG_SHA256  /tmp/ffmpeg.tar.xz" | sha256sum --check --strict
            mkdir -p .ci/ffmpeg
            tar -xJf /tmp/ffmpeg.tar.xz --strip-components=1 -C .ci/ffmpeg
          fi
          echo "$GITHUB_WORKSPACE/.ci/ffmpeg/bin" >> "$GITHUB_PATH"
          .ci/ffmpeg/bin/ffmpeg -version | head -1
          test "$(.ci/ffmpeg/bin/ffmpeg -version | sed -n 's/^ffmpeg version n\?\([0-9][0-9]*\).*/\1/p')" -ge 8

      # 沙箱执行时禁止拉取镜像,所以测试前显式准备。环境不可用必须阻止发版,
      # 不能让隔离用例被跳过后仍然显示测试通过。
      - name: Prepare sandbox runtime
        run: |
          for i in $(seq 1 30); do
            docker info >/dev/null 2>&1 && break
            sleep 1
          done
          test "$(docker info --format '{{.OSType}} {{.MemoryLimit}} {{.SwapLimit}} {{.PidsLimit}}')" = "linux true true true"
          docker pull python:3.14-alpine

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          cd backend && uv sync --frozen --python 3.14

      # 后端的烧字测试要真渲一遍产品默认的那条路(无头 Chromium 按预览 CSS 出 PNG),要找得到构建好的
      # frontend/dist(app/media/text_render.find_frontend_dist 从仓库结构里找)。没有它,那几条在 CI 上整片跳过。
      # 这里只要产物:类型检查在 frontend 那组跑。
      - name: Frontend dist for burned-in text
        run: pnpm --dir frontend exec vite build

      # 烧字的浏览器那条路用 Playwright 自带的 Chromium。取舍:装它多花一两分钟(浏览器本体按 uv.lock 缓存,
      # 系统依赖每次 apt 装),换来字幕 / 花字 / AI 标识的默认导出路径在 CI 上真渲一遍 —— 此前没有任何自动门禁渲过它。
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
      - name: Headless Chromium for burned-in text
        run: cd backend && uv run playwright install --with-deps chromium

      # 并行跑(pytest-xdist):`-n auto` 按核数开 worker,ubuntu-latest(公开仓库)是 4 核,就是 4 个。
      # pyproject 的 addopts 里本来就带着它,这里写出来是让读这一步的人知道日志里那几个 [gwN] 是怎么来的。
      # 每个 worker 有自己的数据目录和库(tests/conftest.py)。单进程时这一步要二十五分钟左右。
      # 排查材料:`-rfEs` 把失败、出错和**跳过的原因**列在最后(此前日志里只有「29 skipped」);`--durations`
      # 列出最慢的几条;junit 里每条用例记着跑在哪个 worker 上,失败时整份传上来(见最后一步)。
      - name: Backend tests
        env:
          MOSAEL_TEST_THREAD_JITTER: ${{ inputs.thread-jitter }}
          MOSAEL_TEST_THREAD_JITTER_SEED: ${{ inputs.shuffle-seed }}
          SHUFFLE_SEED: ${{ inputs.shuffle-seed }}
        run: |
          cd backend
          args=(-q -n auto -rfEs --durations=25 --junitxml="$GITHUB_WORKSPACE/.ci/junit-backend.xml")
          if [ -n "$SHUFFLE_SEED" ]; then
            uv run --with pytest-randomly python -m pytest "${args[@]}" -p randomly --randomly-seed="$SHUFFLE_SEED"
          else
            uv run python -m pytest "${args[@]}"
          fi

      - name: Upload backend test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: junit-backend-${{ github.run_attempt }}
          path: .ci/junit-backend.xml
          if-no-files-found: ignore

  # 社区服务眼下不在产品里(桌面端的接入已拿掉,见 2d1378623),代码留在仓库里等以后接回。它的整套测试要起一个
  # Postgres 容器,没必要每次提交都付这个钱:只在这次改动碰到它自己、它依赖的格式包或这份工作流时跑;发版(打 tag、
  # 手动触发)和算不出改了什么的时候照跑,宁可多跑不漏跑。ruff 仍由 checks 那组的 `pnpm lint` 每次都跑。
  community-changed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          run=true
          if [[ ( "$EVENT" == "pull_request" || "$EVENT" == "push" ) && -n "$BASE" && ! "$BASE" =~ ^0+$ && "$GITHUB_REF" != refs/tags/* ]]; then
            if changed=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null); then
              grep -qE '^(community/|packages/mosael-formats/|\.github/workflows/tests\.yml$)' <<<"$changed" || run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "community tests: $run"

  # 社区服务(ADR 0026):生产跑 PostgreSQL,所以 CI 在 Postgres 服务容器上跑整套测试(本地缺省是 SQLite)。
  # ruff 由上面 checks 那组里根目录的 `pnpm lint` 跑(和本地提交前那一条是同一条),这里再跑一次是为了
  # 这个 job 单独失败时能直接看到是哪一半。
  community:
    needs: [community-changed]
    if: ${{ needs.community-changed.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: community
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: community_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COMMUNITY_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/community_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: community/uv.lock
      - name: Install dependencies
        run: uv sync --frozen --python 3.14
      - name: Lint
        run: uv run ruff check
      - name: Tests (PostgreSQL)
        run: uv run pytest -q

  # 插件包 / 工作流文件 / 画板快照的格式校验:桌面后端和社区服务共用的那一份。
  formats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: packages/mosael-formats
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: packages/mosael-formats/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check
      - name: Tests
        run: uv run pytest -q
