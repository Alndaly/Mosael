# 自动打包发板:推送 v* tag → mac(dmg, arm64)+ win(nsis, x64)并行打包,
# 产物只上传到 GitHub Releases——仓库里永远不进任何构建产物。
#
# 发版方式(唯一入口):
#   git tag v0.2.0 && git push origin v0.2.0
# 应用版本号在 CI 里直接取自 tag(不要求先改 package.json),
# 应用内「检查更新」比对的就是 Releases 的 tag。
#
# 手动触发(workflow_dispatch)= 试打包:只传 workflow artifact,不碰 Releases。
#
# 顺序:test(后端 pytest + 前端 vitest)→ draft → build(mac / win 并行)→ publish。
# 测试不过就不建草稿、不出包 —— 打了 tag 不等于代码是好的,这道闸就是用来把这两件事重新
# 绑在一起的。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 测试闸。放在最前面,失败就什么都不发 —— 此前这条工作流**只跑 sidecar 自己的测试和打包
  # 冒烟**,两套主测试(后端 pytest / 前端 vitest)一次都不跑,于是「打了 tag」和「代码是好的」
  # 之间没有任何关系:v0.20.0 就是带着一条红着的棘轮发出去的(那次只是仓库规范检查,下次未必)。
  #
  # 只在 ubuntu 上跑一份:这两套测试都不依赖平台。**跨平台**才需要验的那部分(打包产物的
  # 初始化顺序)已经由 build 里的 agent-sidecar 冒烟在每个平台各跑一遍。
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # 没有 ffmpeg 的话,9 个测试文件会整体 skip —— 导出与渲染主流程都在里面。
      # 那样这道闸看着是绿的,实际没验到最该验的那部分。
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # runner 上 docker 是装着的,但**刚开机时 daemon 还没起来** —— 探测有 5 秒超时,
      # 撞上就判定"这台机器隔离不住",于是 11 个测权限判定的用例全红,而它们和 docker
      # 本身没关系(run_code 只是载体)。等一下比放宽超时诚实:超时放宽了,真的没有隔离
      # 环境时又要多等那么久才说话。
      - name: Wait for Docker
        run: |
          for i in $(seq 1 30); do
            docker info >/dev/null 2>&1 && echo "docker ready after ${i}s" && exit 0
            sleep 1
          done
          echo "::warning::docker daemon 没起来 —— 依赖隔离环境的用例会失败"

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          cd backend && uv sync --frozen --python 3.13

      - name: Backend tests
        run: cd backend && uv run pytest -q

      # frontend 的 build 脚本本身带 `tsc --noEmit`(见 package.json),所以类型检查
      # 由 build 阶段覆盖,这里只跑单测。
      - name: Frontend tests
        run: cd frontend && pnpm vitest run

  # 先建好草稿 Release(自动生成变更说明),两个平台的构建往同一个草稿传产物,
  # 全部成功后才转正——避免用户在「检查更新」里看到缺产物的半成品版本。
  draft:
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --generate-notes --title "Open Studio $GITHUB_REF_NAME"

      # 插件包和平台无关,所以在这里打一次,而不是 mac/win 各打一遍。
      # 市场索引里的下载地址指的就是这些附件(website/public/plugins/registry.json)——
      # 不传的话,插件页点「安装」拿到的是 404,而索引看起来一切正常。
      - name: Package plugins
        run: |
          mkdir -p dist/plugins
          for dir in plugins/examples/*/; do
            id=$(python3 -c "import json,sys;print(json.load(open('$dir/open-studio.plugin.json'))['id'])")
            (cd "$dir" && zip -qr "$GITHUB_WORKSPACE/dist/plugins/$id.zip" .)
            echo "packed $id"
          done
          ls -la dist/plugins

      - name: Upload plugins to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/plugins/*.zip

  build:
    needs: [test, draft]
    # workflow_dispatch 时 draft 被跳过,也要能继续跑。
    # **test 必须显式要求 success**:`!cancelled()` 会让 build 在依赖失败时照样起来 ——
    # 只写 needs 而不写这一条,测试红了照样出包。
    if: ${{ !cancelled() && needs.test.result == 'success' && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # arm64;Intel Mac 需自签 runner,暂不出包
            asset_glob: release/*.dmg
          - os: windows-latest
            asset_glob: release/*.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # 无签名证书:禁用 electron-builder 的证书自动发现,出未签名包
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # setup-uv 从 v8 起不再发浮动主版本 tag(v9 只有 v9.0.0),官方 README 也改为推荐锁
      # commit SHA。所以这一条与上面几个写法不同,不是笔误。升级时连注释一起换。
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync app version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        # npm pkg set 是幂等的:tag 与 package.json 版本相同也不报错
        # (pnpm version 会以 ERR_PNPM_VERSION_NOT_CHANGED 拒绝)。
        # 仓库里的 package.json 也应当跟着每次发版一起 bump —— 否则本地
        # `electron-builder` 打出来的包永远显示仓库里那个陈旧版本号(曾长期是 0.1.0),
        # 排查时极易误判成「版本号显示有 bug」。这一步只是兜底,不是唯一来源。
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Install backend (uv)
        run: cd backend && uv sync --frozen --python 3.13

      # 声音克隆随包分发的独立 CPython(~48MB)。必须在 electron-builder 之前:
      # extraResources 打包时会读 build/python。失败即让构建红——缺了它,打包版后端
      # (PyInstaller 冻结二进制)建不了 venv,声音克隆会退化成"要用户自己装 Python"。
      # 解包用 tar:macOS 自带 bsdtar,Windows 10+ 也自带 tar.exe(同为 bsdtar),
      # 两者都支持 --strip-components。
      - name: Fetch bundled Python for voice cloning
        run: pnpm fetch:tts-python

      # esbuild 只打包、不做类型检查:发布执行器的源码在此之前从未被 tsc 看过,
      # 于是攒下了失效的 @ts-expect-error 和没人发现的死参数。放在构建前,坏了就别出包。
      - name: Typecheck publisher
        run: pnpm typecheck:electron

      - name: Build frontend / sidecar / publisher / backend
        run: |
          pnpm build:publisher
          pnpm build:system
          pnpm build:frontend
          pnpm build:sidecar
          # 打包产物的初始化顺序只有跑起来才看得出(见 test/bundle.smoke.mjs 的说明)。
          pnpm --dir agent-sidecar test
          pnpm build:backend

      - name: Package (electron-builder)
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            pnpm exec electron-builder --mac dmg --publish never
          else
            pnpm exec electron-builder --win nsis --publish never
          fi

      - name: Smoke packaged Electron and database upgrade
        run: node test/bundle.smoke.mjs

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber ${{ matrix.asset_glob }}

      - name: Upload artifact (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: open-studio-${{ runner.os }}
          path: ${{ matrix.asset_glob }}
          if-no-files-found: error

  publish:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
