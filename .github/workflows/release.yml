# 自动打包发板:推送 v* tag → mac(dmg, arm64)+ win(nsis, x64)并行打包,
# 产物只上传到 GitHub Releases——仓库里永远不进任何构建产物。
#
# 发版方式(唯一入口):
#   git tag v0.2.0 && git push origin v0.2.0
# 应用版本号在 CI 里直接取自 tag(不要求先改 package.json),
# 应用内「检查更新」比对的就是 Releases 的 tag。
#
# 手动触发(workflow_dispatch)= 试打包:只传 workflow artifact,不碰 Releases。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 先建好草稿 Release(自动生成变更说明),两个平台的构建往同一个草稿传产物,
  # 全部成功后才转正——避免用户在「检查更新」里看到缺产物的半成品版本。
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --generate-notes --title "Open Studio $GITHUB_REF_NAME"

  build:
    needs: [draft]
    # workflow_dispatch 时 draft 被跳过,也要能继续跑
    if: ${{ !cancelled() && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # arm64;Intel Mac 需自签 runner,暂不出包
            asset_glob: release/*.dmg
          - os: windows-latest
            asset_glob: release/*.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # 无签名证书:禁用 electron-builder 的证书自动发现,出未签名包
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync app version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        # npm pkg set 是幂等的:tag 与 package.json 版本相同也不报错
        # (pnpm version 会以 ERR_PNPM_VERSION_NOT_CHANGED 拒绝)。
        # 仓库里的 package.json 也应当跟着每次发版一起 bump —— 否则本地
        # `electron-builder` 打出来的包永远显示仓库里那个陈旧版本号(曾长期是 0.1.0),
        # 排查时极易误判成「版本号显示有 bug」。这一步只是兜底,不是唯一来源。
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Install backend (uv)
        run: cd backend && uv sync --frozen --python 3.13

      # 声音克隆随包分发的独立 CPython(~48MB)。必须在 electron-builder 之前:
      # extraResources 打包时会读 build/python。失败即让构建红——缺了它,打包版后端
      # (PyInstaller 冻结二进制)建不了 venv,声音克隆会退化成"要用户自己装 Python"。
      # 解包用 tar:macOS 自带 bsdtar,Windows 10+ 也自带 tar.exe(同为 bsdtar),
      # 两者都支持 --strip-components。
      - name: Fetch bundled Python for voice cloning
        run: pnpm fetch:tts-python

      # esbuild 只打包、不做类型检查:发布执行器的源码在此之前从未被 tsc 看过,
      # 于是攒下了失效的 @ts-expect-error 和没人发现的死参数。放在构建前,坏了就别出包。
      - name: Typecheck publisher
        run: pnpm typecheck:electron

      - name: Build frontend / sidecar / publisher / backend
        run: |
          pnpm build:publisher
          pnpm build:system
          pnpm build:frontend
          pnpm build:sidecar
          # 打包产物的初始化顺序只有跑起来才看得出(见 test/bundle.smoke.mjs 的说明)。
          pnpm --dir agent-sidecar test
          pnpm build:backend

      - name: Package (electron-builder)
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            pnpm exec electron-builder --mac dmg --publish never
          else
            pnpm exec electron-builder --win nsis --publish never
          fi

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber ${{ matrix.asset_glob }}

      - name: Upload artifact (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: open-studio-${{ runner.os }}
          path: ${{ matrix.asset_glob }}
          if-no-files-found: error

  publish:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
