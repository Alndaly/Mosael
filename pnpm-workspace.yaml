packages:
  - "frontend"
  - "agent-sidecar"
  - "browser-extension"

# 依赖的 install 脚本默认不跑(pnpm 的安全默认值),需要跑的在这里逐个点名。
# 漏了会让 `pnpm install --frozen-lockfile` 直接失败(ERR_PNPM_IGNORED_BUILDS),CI 也一样,
# 所以升级引入新的带脚本依赖时必须同步更新这里。
allowBuilds:
  '@google/genai': false # 只是 analytics 之类的 postinstall,不需要
  electron: true # 下载对应平台的 Electron 二进制
  electron-winstaller: true # electron-builder 26 引入;Windows NSIS 安装包要用
  esbuild: true # 下载平台原生二进制
  protobufjs: false

# 供应链冷静期(分钟):只解析发布满 3 天的版本,挡住"刚发布就被投毒"的窗口。
# 没有本体时 exclude 名单会空转——先有这个键,下面的豁免才有意义。
minimumReleaseAge: 4320
# 豁免名单只在「必须用一个还没满 3 天的版本」时临时加,指名到具体版本;那个版本过了冷静期
# 就把它删掉 —— 留着的旧条目不再豁免任何东西,只会让人以为这里还有例外。

onlyBuiltDependencies:
  - electron
  - electron-winstaller
  - esbuild

# electron-builder 26.15.3 起(到 26.16.1 仍是)的依赖声明有缺陷:app-builder-lib 代码里用了
# `ElectronDownloadCacheMode`(只存在于 @electron/get 5.x),依赖却声明成 `^3.0.0`。
# 于是 pnpm 严格解析出 3.0.0,打包在 resolveCacheMode 处炸:
#   TypeError: Cannot read properties of undefined (reading 'ReadWrite')
# npm/yarn 的扁平化会碰巧提升到 5.x 而看不出问题,pnpm 会如实暴露。这里钉到 5.x。
# electron-builder 修正声明后即可移除。
overrides:
  "@electron/get": "^5.1.0"

# 另一处依赖布局上的坑(修在 package.json,记在这里以便一起看):`openapi-typescript`(API
# 类型生成)必须挂在**根**的 devDependencies,不能挂在 frontend。它到 7.13 为止 peer 仍是
# typescript ^5.x,走 `ts.factory` 这套旧编译器 API;而 TypeScript 7 的 npm 包换成了原生实现,
# `ts.factory` 是 undefined,`pnpm gen:api` 起手就崩:
#   TypeError: Cannot read properties of undefined (reading 'createKeywordTypeNode')
# 挂在 frontend 时 peer 会被 frontend 自己的 TS 7 满足;挂在根(根不声明 typescript)则由
# pnpm 自动装一份 TS 5 给它。overrides 和 packageExtensions 都改不了 peer 的解析,试过。
# openapi-typescript 支持 TS 7 后可挪回 frontend。
