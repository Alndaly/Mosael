[project]
name = "open-studio-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy>=2.0",
  "python-multipart>=0.0.9",
  "mcp>=1.28.1",
  "httpx>=0.28.1",
  "lark-oapi>=1.7.1",
  # 知识库文件转换与增强检索
  "markitdown[pdf,docx,pptx,xlsx]>=0.1.1",
  "pymilvus[milvus_lite]>=2.4.4", # milvus-lite:内嵌单文件向量库
  "neo4j>=5.23", # 可选图谱层;未配置连接时不启用
  "fonttools>=4.50", # 读取上传字体的 name 表,取真实族名供 libass 匹配
  # 火山播客 TTS 走 WebSocket。uvicorn[standard] 也会装它,但依赖别人的传递依赖
  # 意味着对方换实现时这里会静默失效,所以显式声明。
  "websockets>=13.0",
  "edge-tts>=7.2.8",
  "playwright>=1.61.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "httpx>=0.28",
  "pyinstaller>=6.21.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  "error::pytest.PytestUnhandledThreadExceptionWarning",
]
