[project]
name = "mosael-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy>=2.1",
  "python-multipart>=0.0.9",
  "mcp>=1.28.1",
  "httpx>=0.28.1",
  "lark-oapi>=1.7.1",
  "fonttools>=4.50", # 读取上传字体的 name 表,取真实族名供 libass 匹配
  # HEIC/HEIF 预览不能依赖系统 ffmpeg 的可选 codec 矩阵。pillow-heif 自带跨平台 libheif wheel，
  # Pillow 是 image_preview 的直接 import，因此两项都显式声明，不借用传递依赖。
  "pillow>=11.3",
  "pillow-heif>=1.3.0",
  # 火山播客 TTS 走 WebSocket。uvicorn[standard] 也会装它,但依赖别人的传递依赖
  # 意味着对方换实现时这里会静默失效,所以显式声明。
  "websockets>=13.0",
  "edge-tts>=7.2.8",
  "playwright>=1.61.0",
  # 落盘加密(见 core/secrets_at_rest)。lark-oapi 也会装它,但依赖别人的传递依赖意味着
  # 对方换实现时这里会静默失效 —— 密钥读不出来的失效方式尤其难查,所以显式声明。
  "cryptography>=42.0",
  # 从链接导入素材(见 media/ytdlp)。合并音视频轨要 ffmpeg,渲染那条链路本来就依赖它。
  "yt-dlp>=2026.1.1",
  # 联网搜索解析网页用(domain/websearch)。此前一直没声明,靠环境里碰巧装着 —— 一次
  # `uv sync` 就把它清掉了,而后端从那一刻起连启动都启动不了。
  "beautifulsoup4>=4.12",
  # 工作流结构化输出在供应商不支持 response_format 时会降级为提示词约束；结果必须在本地
  # 重新按同一份 Schema 校验，不能把“能 json.loads”误当成契约满足。
  "jsonschema>=4.23",
  # 3D 白模参考帧在后端渲染(domain/scenes/render):z-buffer 光栅化 + 阴影图。纯 Python 逐像素
  # 跑不动一帧 960x540,而工作流跑在后端 —— 工作台那个 three.js 渲染器在这里够不着。
  "numpy>=2.1",
  # 插件清单 / 插件包 / 工作流文件的格式与校验,和社区服务共用这一份(ADR 0026)。
  "mosael-formats",
  # 文档的本地解析(ADR 0031,domain/documents/local):PDF 抽文字、渲页面图用 pdfium(Apache-2.0,自带二进制,
  # 不依赖系统库);docx → HTML → Markdown 用 mammoth + markdownify;pptx、xlsx 用 python-pptx、openpyxl。
  # 不用微软那个通用转换库:它新版本依赖 magika → onnxruntime,为认文件类型多带一个几十 MB 的推理运行时。
  "pypdfium2>=4.30",
  "mammoth>=1.9",
  "markdownify>=0.14",
  "python-pptx>=1.0",
  "openpyxl>=3.1",
  "pypinyin>=0.55.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  # 全套按核数并行跑(见下面 addopts 与 tests/conftest.py)。九千多条单进程要二十分钟,门禁没人等得起。
  "pytest-xdist>=3.8",
  # TestClient 的传输。Starlette 1.x 起认 httpx2(还拿 httpx 跑会报弃用告警);此前它是 mcp 顺带装上的,
  # 测试能跑全靠这层传递依赖 —— 显式写上。httpx 本身是运行时依赖,不必在这里再列一次。
  "httpx2>=2.13",
  "pyinstaller>=6.21.0",
  "ruff>=0.14",
]

[tool.uv]
package = false

[tool.uv.sources]
mosael-formats = { path = "../packages/mosael-formats", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# 默认并行:跑全套(或整个目录)时每个核一个 worker,每个 worker 有自己的数据目录(tests/conftest.py)。
# 点名了文件或某一条用例时 conftest 把 worker 数压成 0,就在本进程里跑,print / --pdb 照旧。
# 要强制串行写 `-n 0`;只跑一部分又要并行,写个数字(`-n 8`)。
# worksteal:谁先空下来就去别人手上还没开始的那一截里拿 —— 用例长短差得多(零点几秒到十几秒),
# 本机同样负载下比默认的 load 快一成左右。
addopts = "-n auto --dist worksteal"
# 一条测试跑满这么久还没完,就把每个线程此刻的栈打出来(pytest 自带,不加依赖;只打栈、不杀进程)。
# 测试里有大量 Event.wait、线程 join、子进程:哪天哪条死锁了,CI 日志里要看得到它卡在哪一行,而不是一个
# 等满 job 上限才被掐掉、什么都没留下的运行。最慢的正常用例十几秒,十分钟远在它们之外。
faulthandler_timeout = 600
filterwarnings = [
  "error::pytest.PytestUnhandledThreadExceptionWarning",
]


[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# **选能抓缺陷的,不选风格。** 打开 ruff 的全套会得到七百多条,其中绝大多数是这个代码库
# 故意不遵守的排版意见 —— 而一个开局七百条警告的 lint,和没有 lint 是同一回事:没人会看,
# 于是真的那几条也一起淹掉。
#
# 这三组的价值是当场兑现的:第一次跑就抓出两处 F821(未定义名字),其中
# `domain/agent/judge.py` 那处是活的 NameError —— 它在 autopilot 里被 except 吞成一行日志,
# 判断者从来没工作过,每次都静默退回问人。两千多条测试没看见,因为它们把 `ask` 整个换掉了。
#
#   F   pyflakes —— 未定义名字、没用到的导入与变量
#   E9  语法/运行时错误
#   B   bugbear —— 真的会咬人的写法(可变默认值、except 里丢原因)
select = ["F", "E9", "B"]

# zip 不写 strict:12 处。**这不是"以后再说",是判断题** —— 加上 strict=True 会把
# "两边不一样长"从静默截断变成抛异常,那是行为改变,该逐处看而不是批量开。
# 想收的话:一次一处,每处配一条测试说明两边为什么应该一样长。
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
# 统一装配入口就是干这个的(ADR-0003):导入各领域切片、注册进 Base.metadata、重新导出。
# 这里的"没用到的导入"正是它的产出。
"**/__init__.py" = ["F401"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 的依赖注入**必须**写在参数默认值里 —— 那是框架的接口形状,不是可变默认值的坑。
extend-immutable-calls = [
  "fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Body",
  "fastapi.Query", "fastapi.Header", "fastapi.Path", "fastapi.Cookie",
]
