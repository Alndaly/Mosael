[project]
name = "open-studio-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy>=2.0",
  "python-multipart>=0.0.9",
  "mcp>=1.28.1",
  "httpx>=0.28.1",
  "lark-oapi>=1.7.1",
  "fonttools>=4.50", # 读取上传字体的 name 表,取真实族名供 libass 匹配
  # 火山播客 TTS 走 WebSocket。uvicorn[standard] 也会装它,但依赖别人的传递依赖
  # 意味着对方换实现时这里会静默失效,所以显式声明。
  "websockets>=13.0",
  "edge-tts>=7.2.8",
  "playwright>=1.61.0",
  # 落盘加密(见 core/secrets_at_rest)。lark-oapi 也会装它,但依赖别人的传递依赖意味着
  # 对方换实现时这里会静默失效 —— 密钥读不出来的失效方式尤其难查,所以显式声明。
  "cryptography>=42.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "httpx>=0.28",
  "pyinstaller>=6.21.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  "error::pytest.PytestUnhandledThreadExceptionWarning",
]
