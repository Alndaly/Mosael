[project]
name = "mibu-new-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "python-multipart>=0.0.9",
  "mcp>=1.28.1",
  "httpx>=0.28.1",
  "lark-oapi>=1.7.1",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "httpx>=0.28",
  "pyinstaller>=6.21.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
