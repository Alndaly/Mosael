# 社区服务的数据库迁移。数据库地址取环境变量 COMMUNITY_DATABASE_URL(见 migrations/env.py)。
#   uv run python -m community.cli migrate        # 部署时用这个
#   uv run alembic revision --autogenerate -m "…"  # 改了 models.py 之后生成一条新迁移
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
