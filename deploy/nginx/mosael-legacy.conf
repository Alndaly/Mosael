# 旧域名:pre.mosael.com 是上线前的预览站,**现在只做 301** 到主域 mosael.com。
#
# 为什么还留着它:那条 DNS 记录(Cloudflare 代理)还在,直接删配置会让访问者拿到
# 证书不匹配或 404。保留这个 server 块,顺手把旧链接、搜索引擎里的旧地址都收到主域。
#
# 它有自己的证书(pre.mosael.com),到期由 certbot 续;`certbot renew` 不会动这份文件。
server {
    listen 80;
    listen 443 ssl;
    server_name pre.mosael.com;
    ssl_certificate /etc/letsencrypt/live/pre.mosael.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pre.mosael.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://mosael.com$request_uri;
}
