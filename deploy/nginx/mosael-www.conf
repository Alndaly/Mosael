# www.mosael.com 只做 301 到主域;证书复用 mosael.com 的 SAN(含 www)。
server {
    listen 80;
    server_name www.mosael.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://mosael.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.mosael.com;

    ssl_certificate /etc/letsencrypt/live/mosael.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mosael.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://mosael.com$request_uri;
}
