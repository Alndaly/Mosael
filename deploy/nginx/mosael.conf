# Mosael 的宿主机 nginx 站点配置(官网 + MosaelCloud 同源反代)。
#
# 目标机器上已经有 nginx,所以 Compose 不跑 Caddy、也不发布 80/443:
# compose 只把官网和 Cloud 绑在 127.0.0.1 的回环端口上,对外由这份配置转发。
#
# 安装:
#   sudo cp deploy/nginx/mosael.conf /etc/nginx/conf.d/mosael.conf
#   sudo sed -i 's/${DOMAIN}/mosael.example.com/g' /etc/nginx/conf.d/mosael.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# **nginx 不读 deploy/.env**:下面的 ${DOMAIN} 必须手动(或用上面的 sed)换成真实域名,
# 并且要和 .env 里的 DOMAIN 完全一致 —— Cloud 用它做同源 Origin 校验、拼 OAuth 回调。
#
# 这里两处 proxy_pass 的回环端口要和 docker-compose.yml 的 CLOUD_PORT / WEBSITE_PORT
# 对应(默认 8901 / 3000);改了那两个变量,这里也要一起改。
#
# 主域是 mosael.com。旧的预览域 pre.mosael.com 单独一份(conf.d/mosael-legacy.conf),
# 只做 `return 301 https://mosael.com$request_uri` —— 一个站只认一个主机名,预览域不再单独提供内容。
#
# HTTPS 不在这里写:用 `sudo certbot --nginx -d <域名>` 让它自动补 443 与证书。
# certbot 会改这个文件,跑之前先备份:cp -a /etc/nginx /root/nginx.bak

server {
    listen 80;
    server_name ${DOMAIN};

    # 注册 / 上传要用的请求体上限。Cloud 接口原来是 1MB,注册表单和素材上传都不够用。
    client_max_body_size 20m;

    # 同源:浏览器只看见一个 Origin,Cloud 的 HttpOnly 会话 cookie 才是第一方的。
    # 下面这两个头是硬要求:
    #   Host              —— Cloud 据此判断用户访问的域名 / 拼 OAuth 回调地址
    #   X-Forwarded-Proto —— 少了它 Cloud 以为请求走的是 http,不会下发 Secure cookie
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # 原来是 Caddy 带的基础安全头,原样保留。HSTS 要等 certbot 补上 443 才真正生效。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    server_tokens off;

    # 云账号接口 → MosaelCloud(FastAPI)。proxy_pass 不带 URI,原样转发 /api/cloud/v1/*。
    location /api/cloud/ {
        proxy_pass http://127.0.0.1:8901;
        proxy_http_version 1.1;
    }

    # 其余 → 官网(Next.js standalone)。
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
    }
}

# ---------------------------------------------------------------- www 的处理(二选一)
# 上面 server_name 只写了主域。要让 www 也能访问,只能选下面一种;
# **CLOUD_PUBLIC_URL 只能对应其中一个 Origin** —— 两个域名都能登录/保存是做不到的
# (Cloud 只认 .env 里 DOMAIN 拼出的那一个 Origin)。
#
# ① 推荐:www 301 跳到主域。取消下面整段注释:
#
#   server {
#       listen 80;
#       server_name www.${DOMAIN};
#       return 301 https://${DOMAIN}$request_uri;
#   }
#
#   .env 里 DOMAIN 仍写主域(例如 example.com),CLOUD_PUBLIC_URL=https://example.com;
#   用户从 www 进来会被跳到主域,Origin 始终一致。证书要同时覆盖两个名字就用:
#   sudo certbot --nginx -d <域名> -d www.<域名>
#
# ② 主域和 www 由同一个 server 服务。把上面主 server 的 server_name 改成:
#
#   server_name ${DOMAIN} www.${DOMAIN};
#
#   此时两个入口都能打开页面,但 Cloud 仍只认 .env 里 DOMAIN 对应的那一个 Origin:
#   从另一个域名登录后,写请求会被同源校验拒绝(cross_site_request)。
#   真要保留这种写法,就把 DOMAIN 填成用户实际使用的那一个,并让另一个 301 过来。
