# mosael.cn:与 mosael.com 同一份官网 / MosaelCloud,同源反代。
#
# 安装:
#   sudo cp deploy/nginx/mosael.cn.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 证书由 certbot 管理;Cloudflare 代理开 Full (strict) 时源站也使用这张 LE 证书。
# 首次签发:
#   sudo certbot certonly --webroot -w /var/www/certbot -d mosael.cn -d www.mosael.cn
server {
    listen 80;
    server_name mosael.cn www.mosael.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name mosael.cn www.mosael.cn;

    ssl_certificate /etc/letsencrypt/live/mosael.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mosael.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    server_tokens off;

    location /api/cloud/ {
        proxy_pass http://127.0.0.1:8901;
        proxy_http_version 1.1;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
    }
}
