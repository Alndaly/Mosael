# Cloud 服务的数据库迁移。表结构只由这里的脚本演进,不靠 create_all 猜。
#   uv run python -m cloud.cli migrate                          # 部署时用这个(升到 head)
#   uv run alembic revision --autogenerate -m "…"              # 改了 models.py 之后生成一条新迁移
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
