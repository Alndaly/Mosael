[project]
name = "mosael-cloud"
version = "0.1.0"
description = "MosaelCloud: the Mosael account service, community shares and the official model relay."
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy>=2.1",
  # 表结构变化一律走 Alembic(migrations/),不在读取代码里认两种形状。
  "alembic>=1.14",
  # 密码哈希只用成熟库的 argon2id,不自己写 KDF。
  "argon2-cffi>=23.1",
  # Pydantic 的 EmailStr 需要它;校验邮箱格式这件事不自己写正则。
  "email-validator>=2.0",
  # 生产用 PostgreSQL;本地、测试用 SQLite。
  "psycopg[binary]>=3.2",
  # 网关向上游模型服务发(流式)请求;TestClient 的传输也认它(Starlette 1.x 起)。
  "httpx2>=2.16",
  # 上游通道的 API Key 落库前用 Fernet 加密(见 domain/channel_keys.py),不自己写对称加密。
  "cryptography>=46",
  "tencentcloud-sdk-python-sms>=3.1.153",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cloud"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
  "error::pytest.PytestUnhandledThreadExceptionWarning",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# 和 backend/ 同一组:能抓缺陷的,不是风格(理由见 backend/pyproject.toml)。
select = ["F", "E9", "B"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Body",
  "fastapi.Query", "fastapi.Header", "fastapi.Path", "fastapi.Cookie",
]
